<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Preview</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #image {
            width: 500px;
            height: 300px;
            border: 3px solid black;
            margin: 30px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            font-size: 20px;
        }

        .preview {
            width: 150px;
            height: 100px;
            object-fit: cover;
            margin: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Image Preview</h1>

    <div id="image">
        Di chuột qua hình ảnh bên dưới để hiển thị tại đây.
    </div>

    <div>
        <img
            class="preview"
            src="https://images.unsplash.com/photo-1506744038136-46273834b3fb"
            alt="Beautiful mountain landscape"
            onmouseover="upDate(this)"
            onmouseout="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
            alt="Beautiful beach landscape"
            onmouseover="upDate(this)"
            onmouseout="undo()"
        >

        <img
            class="preview"
            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
            alt="Beautiful nature landscape"
            onmouseover="upDate(this)"
            onmouseout="undo()"
        >
    </div>

    <script src="script.js"></script>

</body>
</html>
